<title>Quantinerie — Suivi des heures</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bleu:#1F4E78;--bleu2:#2E75B6;--bord:#E4E4DF;--gris:#6B6B66;--fond:#F2F1EC;--vert:#2E7D32;--rouge:#C0392B;}
  *{box-sizing:border-box;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  body{margin:0;min-height:100vh;background:var(--fond);display:flex;align-items:center;justify-content:center;padding:20px;color:#20201E;}
  .card{background:#fff;border:1px solid var(--bord);border-radius:16px;max-width:390px;width:100%;padding:34px 30px;box-shadow:0 8px 30px rgba(0,0,0,.06);text-align:center;}
  .logo{height:60px;width:auto;margin-bottom:4px;}
  h1{font-size:18px;margin:12px 0 2px;color:var(--bleu);}
  .sub{font-size:13px;color:var(--gris);margin-bottom:22px;}
  label{display:block;text-align:left;font-size:12px;color:var(--gris);margin:14px 0 4px;}
  input{width:100%;padding:11px;border:1px solid var(--bord);border-radius:9px;font-size:15px;}
  button{width:100%;margin-top:20px;padding:12px;border:none;border-radius:9px;background:var(--bleu);color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
  button:hover{background:#173a5c;} button:disabled{opacity:.6;cursor:default;}
  .msg{margin-top:16px;font-size:13px;min-height:18px;}
  .msg.err{color:var(--rouge);} .msg.ok{color:var(--vert);}
  .foot{margin-top:20px;font-size:11px;color:#9a9a94;}
  .chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 12px;border-radius:20px;background:#E6F1FB;color:var(--bleu2);}
  .lien{margin-top:16px;font-size:12px;color:var(--bleu2);cursor:pointer;}
  .hidden{display:none;}
</style>
</head>

    <!-- Écran connexion -->
    <div id="vue-login">
      <h1>Suivi des heures</h1>
      <div class="sub">Connexion à ton espace</div>
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="prenom@laquantinerie.fr" autocomplete="username">
      <label for="mdp">Mot de passe</label>
      <input id="mdp" type="password" placeholder="••••••••" autocomplete="current-password">
      <button id="btn-login" onclick="seConnecter()">Se connecter</button>
      <div id="msg" class="msg"></div>
    </div>

    <!-- Écran connecté (provisoire — valide que tout fonctionne) -->
    <div id="vue-connecte" class="hidden">
      <h1>Bienvenue</h1>
      <div class="sub">Tu es bien connecté à la base sécurisée</div>
      <p style="font-size:15px;margin:6px 0"><b id="c-nom"></b></p>
      <p style="margin:6px 0"><span class="chip" id="c-role"></span></p>
      <p style="font-size:12px;color:var(--gris);margin-top:16px">Cet écran confirme que la connexion, la base de données et le cloisonnement fonctionnent. Les vrais écrans (saisie, tableau de bord…) arrivent à l'étape suivante.</p>
      <button onclick="seDeconnecter()" style="background:#fff;color:var(--bleu);border:1px solid var(--bord)">Se déconnecter</button>
    </div>

    <div class="foot">La Quantinerie · application interne</div>
  </div>

<script>
  const SUPABASE_URL = 'https://svbodvzehnwrtctrxtoh.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_2LOkbFcfwZn2CaelsmoHDw_uLT5p08N';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = id => document.getElementById(id);
  function montrer(vue){ $('vue-login').classList.toggle('hidden', vue!=='login'); $('vue-connecte').classList.toggle('hidden', vue!=='connecte'); }
  function message(txt, type){ const m=$('msg'); m.textContent=txt||''; m.className='msg '+(type||''); }

  async function seConnecter(){
    const email=$('email').value.trim(), mdp=$('mdp').value;
    if(!email||!mdp){ message('Renseigne ton email et ton mot de passe.','err'); return; }
    $('btn-login').disabled=true; message('Connexion…');
    const { error } = await sb.auth.signInWithPassword({ email, password: mdp });
    $('btn-login').disabled=false;
    if(error){ message('Email ou mot de passe incorrect.','err'); return; }
    message(''); await afficherProfil();
  }

  async function afficherProfil(){
    const { data:{ user } } = await sb.auth.getUser();
    if(!user){ montrer('login'); return; }
    const { data:profil } = await sb.from('profiles').select('nom, role').eq('id', user.id).single();
    $('c-nom').textContent = profil ? profil.nom : user.email;
    $('c-role').textContent = profil && profil.role==='direction' ? 'Direction' : 'Salarié';
    montrer('connecte');
  }

  async function seDeconnecter(){ await sb.auth.signOut(); $('email').value=''; $('mdp').value=''; montrer('login'); }

  // Au chargement : si déjà connecté, on va direct sur l'écran connecté
  (async()=>{ const { data:{ session } } = await sb.auth.getSession(); if(session) await afficherProfil(); else montrer('login'); })();
  document.addEventListener('keydown', e=>{ if(e.key==='Enter' && !$('vue-login').classList.contains('hidden')) seConnecter(); });
</script>
